[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; J2 ESP32 is on COM3 (COM7 is the moteus link). If it re-enumerates to a
; different port, change these two lines -- or delete them to let PlatformIO
; auto-detect.
upload_port = COM3
monitor_port = COM3
